<!DOCTYPE html>
<html lang="ru">
	<head>

		<meta charset="UTF-8">

			<meta name="viewport"
				  content="width=device-width, initial-scale=1.0">

				<title>Небольшой тест 💕</title>

				<link rel="stylesheet" href="style.css" />
			</meta>
		</meta>

</head>

	<body>

		<div class="page">

			<div class="top-heart">💞</div>

			<h1>Небольшой тест</h1>

			<p class="subtitle">
				Посмотрим, насколько хорошо ты знаешь правильные ответы 😌
			</p>


			<div class="question-box">

				<h2 id="questionNumber">
					Вопрос 1 из 4
				</h2>

				<h3 id="questionText">
					Кто сегодня самая красивая?
				</h3>


				<div id="answers" class="answers"></div>


				<p id="questionMessage"
				   class="question-message">
				</p>

			</div>


			<button id="questionNext"
					class="main-button hidden"
					onclick="nextQuestion()">

				Следующий вопрос →

			</button>


			<button id="finishButton"
					class="main-button hidden"
					onclick="goToWish()">

				Перейти дальше ❤️

			</button>

		</div>


		<script src="script.js"></script>

	</body>
</html>
